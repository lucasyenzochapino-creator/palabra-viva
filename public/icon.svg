<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo oscuro sepia -->
  <rect width="512" height="512" rx="90" fill="#1a0e05"/>
  <!-- Textura de fondo -->
  <rect width="512" height="512" rx="90" fill="url(#bg)" opacity="0.3"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7c4a1e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d0702" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#fff7a0"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Libro - páginas derecha -->
  <path d="M265 130 Q340 125 390 145 L390 360 Q335 340 265 348 Z" fill="#c8a87a" opacity="0.9"/>
  <!-- Libro - páginas izquierda -->
  <path d="M247 130 Q172 125 122 145 L122 360 Q177 340 247 348 Z" fill="#d4b896" opacity="0.9"/>
  <!-- Lomo del libro -->
  <rect x="247" y="128" width="18" height="222" rx="4" fill="#8b5e2e"/>
  <!-- Líneas de texto derecha -->
  <line x1="280" y1="190" x2="370" y2="185" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="280" y1="215" x2="370" y2="210" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="280" y1="240" x2="345" y2="236" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- Líneas de texto izquierda -->
  <line x1="142" y1="190" x2="232" y2="185" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="142" y1="215" x2="232" y2="210" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="142" y1="240" x2="210" y2="236" stroke="#7c4a1e" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <!-- Llama -->
  <path d="M256 80 C248 95 238 105 240 120 C242 132 250 138 256 140 C262 138 270 132 272 120 C274 105 264 95 256 80Z" fill="url(#flame)"/>
  <path d="M256 100 C252 110 248 116 250 124 C252 130 254 133 256 134 C258 133 260 130 262 124 C264 116 260 110 256 100Z" fill="#fff7a0" opacity="0.8"/>
</svg>
